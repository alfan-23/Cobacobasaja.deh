<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrasi Digital</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Sidebar */
        .sidebar {
            width: 260px;
            background-color: #1e293b;
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            background-color: #0f172a;
        }

        .nav-menu {
            flex: 1;
            padding: 10px 0;
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            border-left: 4px solid transparent;
        }

        .nav-item:hover {
            background-color: #334155;
        }

        .nav-item.active {
            background-color: #334155;
            border-left: 4px solid #38bdf8;
            color: #38bdf8;
        }

        /* Area Konten Utama */
        .content-area {
            flex: 1;
            background-color: #f1f5f9;
            display: flex;
            flex-direction: column;
        }

        /* Frame untuk memuat file HTML lain */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            Portal Digital Kesehatan
        </div>
        <div class="nav-menu">
            <div class="nav-item active" onclick="loadApp(this, 'sk.html')">
                📝 SK-Generator Pro
            </div>
            <div class="nav-item" onclick="loadApp(this, 'sop.html')">
                ⚙️ AI SOP Generator
            </div>
        </div>
        <div style="padding: 15px; font-size: 0.8rem; color: #94a3b8; text-align: center;">
            v1.0 - Digitalisasi Administrasi
        </div>
    </div>

    <div class="content-area">
        <!-- File pertama yang dimuat otomatis -->
        <iframe id="app-frame" src="sk.html"></iframe>
    </div>

    <script>
        function loadApp(element, fileName) {
            // Ubah link iframe
            document.getElementById('app-frame').src = fileName;

            // Update status aktif di menu sidebar
            const items = document.querySelectorAll('.nav-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
